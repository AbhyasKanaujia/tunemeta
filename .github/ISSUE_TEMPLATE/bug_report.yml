name: Bug report
description: Something isn't working right
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `tunemeta tag song.mp3 "..."` (or: open the app, click...)
        2. ...
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: How are you using tunemeta?
      options:
        - Desktop app
        - Command line (pip install)
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and version
      placeholder: e.g. macOS 15.1, Windows 11, Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: tunemeta version
      description: App&#58; Help/About, or the download filename. CLI&#58; `pip show tunemeta`.
  - type: textarea
    id: logs
    attributes:
      label: Relevant output or error message
      render: shell
