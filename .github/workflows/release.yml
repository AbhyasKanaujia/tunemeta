name: Release builds

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Falls back to "dev" for workflow_dispatch runs, which have no release tag.
  VERSION: ${{ github.event.release.tag_name || 'dev' }}

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: brew install create-dmg
      - run: pip install -e ".[gui,build]"
      - run: bash packaging/build_macos.sh
      - run: cp dist/tunemeta.dmg dist/tunemeta-${{ env.VERSION }}-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: tunemeta-macos
          path: dist/tunemeta-${{ env.VERSION }}-macos.dmg
      # Uploads both a versioned copy (so saved downloads from different
      # releases are distinguishable) and the plain-named one (so the
      # releases/latest/download/tunemeta-macos.dmg links in README.md and
      # docs/index.html keep working).
      - if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" dist/tunemeta-${{ env.VERSION }}-macos.dmg dist/tunemeta.dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[gui,build]"
      - run: powershell -ExecutionPolicy Bypass -File packaging/build_windows.ps1
      - run: copy dist\tunemeta.exe dist\tunemeta-${{ env.VERSION }}-windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: tunemeta-windows
          path: dist/tunemeta-${{ env.VERSION }}-windows.exe
      # Uploads both a versioned copy (so saved downloads from different
      # releases are distinguishable) and the plain-named one (so the
      # releases/latest/download/tunemeta-windows.exe links in README.md and
      # docs/index.html keep working).
      - if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" dist/tunemeta-${{ env.VERSION }}-windows.exe dist/tunemeta.exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi gir1.2-gtk-3.0 gir1.2-webkit2-4.1 \
            libgirepository1.0-dev libcairo2-dev pkg-config python3-dev gcc
      - run: pip install -e ".[gui,build]" "pywebview[gtk]"
      - run: bash packaging/build_linux.sh
      - run: cp dist/tunemeta dist/tunemeta-${{ env.VERSION }}-linux
      - uses: actions/upload-artifact@v4
        with:
          name: tunemeta-linux
          path: dist/tunemeta-${{ env.VERSION }}-linux
      # Uploads both a versioned copy (so saved downloads from different
      # releases are distinguishable) and the plain-named one (so the
      # releases/latest/download/tunemeta-linux link in README.md and
      # docs/index.html keeps working).
      - if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" dist/tunemeta-${{ env.VERSION }}-linux dist/tunemeta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
