name: Release builds

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: brew install create-dmg
      - run: pip install -e ".[gui,build]"
      - run: bash packaging/build_macos.sh
      - run: mv dist/tunemeta.dmg dist/tunemeta-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: tunemeta-macos
          path: dist/tunemeta-macos.dmg
      - if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" dist/tunemeta-macos.dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[gui,build]"
      - run: powershell -ExecutionPolicy Bypass -File packaging/build_windows.ps1
      - run: move dist\tunemeta.exe dist\tunemeta-windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: tunemeta-windows
          path: dist/tunemeta-windows.exe
      - if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" dist/tunemeta-windows.exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi gir1.2-gtk-3.0 gir1.2-webkit2-4.1 \
            libgirepository1.0-dev libcairo2-dev pkg-config python3-dev gcc
      - run: pip install -e ".[gui,build]" "pywebview[gtk]"
      - run: bash packaging/build_linux.sh
      - run: mv dist/tunemeta dist/tunemeta-linux
      - uses: actions/upload-artifact@v4
        with:
          name: tunemeta-linux
          path: dist/tunemeta-linux
      - if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" dist/tunemeta-linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
